version: '3.1'
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    networks:
      - superset-network

  superset:
    image: apache/superset:latest
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_ENV=production
      - SUPERSET_DB_URI=postgresql+psycopg2://superset:superset@postgres/superset
      - SECRET_KEY=CSJdw81i2E1nGchC35GAinwqKBSTBrqUaelSPeQcCzLX0aWTRRC5Y86k
    depends_on:
      - postgres
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
    networks:
      - superset-network
    command: >
      sh -c "
      superset db upgrade &&
      superset init &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin_password &&
      superset run -p 8088 --with-threads --reload --debugger
      "

networks:
  superset-network:
    driver: bridge

